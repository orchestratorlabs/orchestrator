<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OrchestratoR™ — Accessibility Co-pilot</title>
    <meta
      name="description"
      content="Evaluates button components against WCAG rules with a live light/dark preview. Deterministic accessibility scoring with AI-assisted validation. Portfolio demo."
    />
    <meta name="theme-color" content="#1A1A1A" />

    <!-- Favicons, generated from the 710x710 source at public/logo.png. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Link previews for LinkedIn, Slack, iMessage, email clients and search.
      og:image and og:url must be absolute URLs, so they point at the production
      domain — previews only render once demo.orchestratorlabs.ai is live.
      To change the card, replace public/og-image.png (1200x630); no markup
      change is needed.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OrchestratoR™" />
    <meta property="og:title" content="OrchestratoR™ — Accessibility Co-pilot" />
    <meta
      property="og:description"
      content="Evaluates button components against WCAG rules with a live light/dark preview. Deterministic scoring, AI-assisted validation."
    />
    <meta property="og:url" content="https://demo.orchestratorlabs.ai/" />
    <meta property="og:image" content="https://demo.orchestratorlabs.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OrchestratoR™ — accessibility co-pilot for product teams" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OrchestratoR™ — Accessibility Co-pilot" />
    <meta
      name="twitter:description"
      content="Evaluates button components against WCAG rules with a live light/dark preview. Deterministic scoring, AI-assisted validation."
    />
    <meta name="twitter:image" content="https://demo.orchestratorlabs.ai/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
